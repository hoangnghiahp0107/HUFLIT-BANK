<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="img/logo.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nạp tiền HUFLIT BANK</title>
    <link rel="stylesheet" href="deposit.css" />
  </head>
  <body>
    <div class="container" role="main">
      <form id="fraud-form" action="/create-payment-link" method="post">
        <label for="price">Giá tiền</label>
        <div class="price-input">
          <input
            type="number"
            class="price"
            id="amount"
            name="amount"
            min="0"
            placeholder="Nhập giá tiền"
            required
          />
        </div>
        <button type="submit" id="create-payment-link-btn">
          Tạo Link thanh toán
        </button>
      </form>
    </div>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      const form = document.getElementById("fraud-form");

      const transactionData = {
        features: [
          -4.72771265581559, 3.04446910225824, -5.59835426695611,
          5.92819080241929, -4.48742195988547, -1.3070104231933,
          -4.13889121357616, 5.14940878300581, -11.1240186070579,
          -7.84094220494304, -6.77706923974191, -9.93176515376766,
          -4.09302112201074, 30.39,
        ],
      };

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        try {
          debugger;
          const response = await fetch("http://127.0.0.1:5000/api/predict", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(transactionData),
          });
          const result = await response.json();
          if (result.gianLan === 1) {
            Swal.fire({
              icon: "error",
              title: "Phát hiện gian lận",
              text: result.ghiChu || "Giao dịch có dấu hiệu gian lận.",
              confirmButtonColor: "#2352ff",
            });
          } else {
            // Cho submit lại form nếu không có gian lận
            form.submit();
          }
        } catch (error) {
          console.error("Lỗi gọi API:", error);
          Swal.fire({
            icon: "error",
            title: "Lỗi mạng",
            text: "Không thể gọi API. Vui lòng thử lại.",
            confirmButtonColor: "#2352ff",
          });
        }
      });
    </script>
  </body>
</html>
