<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="img/logo.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nạp tiền HUFLIT BANK</title>
    <link rel="stylesheet" href="deposit.css" />
  </head>
  <body>
    <div class="container" role="main">
      <form id="fraud-form" action="/create-payment-link" method="post">
        <label for="price">Giá tiền</label>
        <div class="price-input">
          <input
            type="number"
            class="price"
            id="amount"
            name="amount"
            min="0"
            placeholder="Nhập giá tiền"
            required
          />
        </div>
        <button type="submit" id="create-payment-link-btn">
          Tạo Link thanh toán
        </button>
      </form>
    </div>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      const form = document.getElementById("fraud-form");

      const transactionData = {
        features: [
-0.26064780489439815,
-0.46964845005363426,
2.4962660826315637,
-0.08372391267814633,
0.5190136179018007,
0.7271592691096374,
0.6377345411881967,
-0.9870200098799841,
0.2934381004820159,
0.5490198936308889,
0.2155979938725388,
0.5123066605849524,
0.3336437173298195,
17982.1
        ],
      };

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        try {
          debugger;
          const response = await fetch("http://127.0.0.1:5000/api/predict", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(transactionData),
          });
          const result = await response.json();
          if (result.gianLan === 1) {
            Swal.fire({
              icon: "error",
              title: "Phát hiện gian lận",
              text: result.ghiChu || "Giao dịch có dấu hiệu gian lận.",
              confirmButtonColor: "#2352ff",
            });
          } else {
            // Cho submit lại form nếu không có gian lận
            form.submit();
          }
        } catch (error) {
          console.error("Lỗi gọi API:", error);
          Swal.fire({
            icon: "error",
            title: "Lỗi mạng",
            text: "Không thể gọi API. Vui lòng thử lại.",
            confirmButtonColor: "#2352ff",
          });
        }
      });
    </script>
  </body>
</html>
